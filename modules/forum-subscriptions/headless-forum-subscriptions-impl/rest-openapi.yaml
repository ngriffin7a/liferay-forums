components:
    schemas:
        Subscriber:
            description: A user subscribed to a forum resource.
            properties:
                emailAddress:
                    type: string
                userId:
                    format: int64
                    type: integer
            type: object
        WebNotification:
            description: An in-portal notification for a user.
            properties:
                body:
                    type: string
                subject:
                    type: string
                url:
                    type: string
                userIds:
                    items:
                        format: int64
                        type: integer
                    type: array
            type: object
    securitySchemes:
        oauth2:
            flows:
                clientCredentials:
                    scopes:
                        Liferay.Forum.Subscriptions.everything: Everything
                    tokenUrl: ""
            type: oauth2
security:
    - oauth2:
        - Liferay.Forum.Subscriptions.everything
info:
    description:
        "API to retrieve subscribers for forum resources.. A Java client JAR is available for use with the group ID
        'com.liferay', artifact ID 'com.liferay.headless.forum.subscriptions.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Forum Subscriptions
    version: v1.0
openapi: 3.0.1
paths:
    "/messages/{messageId}/subscribers":
        get:
            description:
                Returns all users subscribed to the ForumMessage with the
                given ID.
            operationId: getMessageSubscribersPage
            parameters:
                -   in: path
                    name: messageId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Subscriber"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Subscriber"
                                type: array
            tags: ["Subscriber"]
    "/web-notifications":
        post:
            description: Sends an in-portal web notification to a user.
            operationId: postWebNotification
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/WebNotification"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/WebNotification"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/WebNotification"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/WebNotification"
            tags: ["WebNotification"]
