<div class="forums-message-list panel panel-secondary" id="forumsMessageList"
	data-label-all-messages="${languageUtil.get(locale, "all-discussions")}"
	data-label-category="${languageUtil.get(locale, "category")}"
	data-label-no-messages="${languageUtil.get(locale, "no-messages-found")}"
	data-label-untitled-message="${languageUtil.get(locale, "untitled-message")}"
	data-label-unknown="${languageUtil.get(locale, "unknown")}"
	data-label-solved="${languageUtil.get(locale, "solved")}"
	data-label-delete="${languageUtil.get(locale, "delete")}"
	data-label-unable-to-load="${languageUtil.get(locale, "unable-to-load-messages")}"
	data-label-delete-topic="${languageUtil.get(locale, "delete-topic")}"
	data-label-confirm-delete-topic="${languageUtil.get(locale, "confirm-delete-topic")}"
	data-label-cancel="${languageUtil.get(locale, "cancel")}"
	data-label-just-now="${languageUtil.get(locale, "just-now")}"
	data-label-x-minutes-ago="${languageUtil.get(locale, "x-minutes-ago")}"
	data-label-x-hours-ago="${languageUtil.get(locale, "x-hours-ago")}"
	data-label-x-days-ago="${languageUtil.get(locale, "x-days-ago")}"
	data-label-x-reply="${languageUtil.get(locale, "x-reply-singular")}"
	data-label-x-replies="${languageUtil.get(locale, "x-replies-plural")}"
	data-label-flagged="${languageUtil.get(locale, "flagged")}"
	data-label-views="${languageUtil.get(locale, "views")}"
	data-label-all-categories="${languageUtil.get(locale, "all-categories")}"
	data-label-showing="${languageUtil.get(locale, "showing-x-of-x-items")}">
	<div class="panel-body">

		<!-- Breadcrumb -->
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb" id="forumsMessageListBreadcrumb">
				<li class="breadcrumb-item"><a class="breadcrumb-link" href="?">${languageUtil.get(locale, "forums")}</a></li>
				<li class="breadcrumb-item active"><a class="breadcrumb-link" aria-current="page" href="#" id="forumsMessageListCategoryName">${languageUtil.get(locale, "all-discussions")}</a></li>
			</ol>
		</nav>

		<!-- Header row: Category name + search + CTA -->
		<div class="forums-message-list__header">
			<h2 class="mb-0 text-dark" id="forumsMessageListHeading">${languageUtil.get(locale, "all-discussions")}</h2>
			<div class="forums-message-list__actions">
				<select class="form-control forums-message-list__category-filter" id="forumsMessageListCategoryFilter" aria-label="${languageUtil.get(locale, "filter-by-category")}">
					<option value="">${languageUtil.get(locale, "all-categories")}</option>
				</select>
				<div class="forums-message-list__search input-group" id="forumsMessageListSearch">
					<div class="input-group-item">
						<input type="text" class="form-control input-group-inset input-group-inset-after" id="forumsMessageListSearchInput" placeholder="${languageUtil.get(locale, "search-messages")}" aria-label="${languageUtil.get(locale, "search-messages")}">
						<div class="input-group-inset-item input-group-inset-item-after">
							<button class="btn btn-unstyled" type="button" id="forumsMessageListSearchBtn" aria-label="${languageUtil.get(locale, "search-messages")}">
								<svg class="lexicon-icon lexicon-icon-search" focusable="false" role="presentation">
									<use href="${themeDisplay.getPathThemeImages()}/clay/icons.svg#search"></use>
								</svg>
							</button>
						</div>
					</div>
				</div>
				<button type="button" class="btn btn-primary text-nowrap" id="forumsMessageListAskBtn" data-forums-compose style="display: none;">New Discussion</button>
			</div>
		</div>

		<!-- Tab filters -->
		<ul class="nav nav-tabs mb-4" id="forumsMessageListTabs" role="tablist">
			<li class="nav-item" role="presentation">
				<a class="nav-link active" href="#" data-sort="dateCreated:desc" role="tab" id="forumsTabRecent" aria-selected="true">${languageUtil.get(locale, "recent")}</a>
			</li>
			<li class="nav-item" role="presentation">
				<a class="nav-link" href="#" data-sort="lastPostDate:desc" role="tab" id="forumsTabRecentActivity" aria-selected="false">${languageUtil.get(locale, "recent-activity")}</a>
			</li>
		</ul>

		<!-- Showing x-y of total -->
		<div id="forumsMessageListShowing" class="text-secondary small mb-3" style="display:none;"></div>

		<!-- Message cards -->
		<div id="forumsMessageListCards">
			<div id="forumsMessageListLoading" aria-busy="true" aria-label="${languageUtil.get(locale, "loading")}">
				<div class="forums-message-list__skeleton-showing">
					<div class="forums-skeleton__bar forums-skeleton__bar--sm"></div>
				</div>
				<div class="forums-message-list__skeleton-card">
					<div class="forums-message-list__skeleton-inner">
						<div class="forums-message-list__skeleton-avatar-col">
							<div class="forums-skeleton__avatar"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name-short"></div>
						</div>
						<div class="forums-message-list__skeleton-content">
							<div class="forums-skeleton__bar forums-skeleton__bar--title forums-skeleton__bar--3q"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--half"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--3q"></div>
							<div class="forums-message-list__skeleton-meta">
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
							</div>
						</div>
					</div>
				</div>
				<div class="forums-message-list__skeleton-card">
					<div class="forums-message-list__skeleton-inner">
						<div class="forums-message-list__skeleton-avatar-col">
							<div class="forums-skeleton__avatar"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name-short"></div>
						</div>
						<div class="forums-message-list__skeleton-content">
							<div class="forums-skeleton__bar forums-skeleton__bar--title"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--3q"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--half"></div>
							<div class="forums-message-list__skeleton-meta">
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
							</div>
						</div>
					</div>
				</div>
				<div class="forums-message-list__skeleton-card">
					<div class="forums-message-list__skeleton-inner">
						<div class="forums-message-list__skeleton-avatar-col">
							<div class="forums-skeleton__avatar"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name-short"></div>
						</div>
						<div class="forums-message-list__skeleton-content">
							<div class="forums-skeleton__bar forums-skeleton__bar--title forums-skeleton__bar--half"></div>
							<div class="forums-skeleton__bar"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--3q"></div>
							<div class="forums-message-list__skeleton-meta">
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
							</div>
						</div>
					</div>
				</div>
				<div class="forums-message-list__skeleton-card">
					<div class="forums-message-list__skeleton-inner">
						<div class="forums-message-list__skeleton-avatar-col">
							<div class="forums-skeleton__avatar"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--name-short"></div>
						</div>
						<div class="forums-message-list__skeleton-content">
							<div class="forums-skeleton__bar forums-skeleton__bar--title forums-skeleton__bar--3q"></div>
							<div class="forums-skeleton__bar forums-skeleton__bar--half"></div>
							<div class="forums-message-list__skeleton-meta">
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
								<div class="forums-skeleton__bar forums-skeleton__bar--xs"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Pagination -->
		<nav aria-label="${languageUtil.get(locale, "message-pagination")}" id="forumsMessageListPagination" class="mt-4" style="display:none;">
			<ul class="pagination justify-content-center" id="forumsMessageListPaginationUl">
			</ul>
		</nav>

	</div>
</div>
