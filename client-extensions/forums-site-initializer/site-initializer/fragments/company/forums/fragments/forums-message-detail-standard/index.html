<!-- Forums Message Detail child (Standard). Renders the original post, solution
     cards, and reply tree from the payload the shell publishes on
     window.forumsMessageDetail. Carries its own render labels; date + avatar
     formatting come from api.helpers. -->
<div class="forums-message-detail-child forums-message-detail-child--standard" id="forumsMessageDetailStandard"
	data-label-unknown="${languageUtil.get(locale, "unknown")}"
	data-label-untitled-message="${languageUtil.get(locale, "untitled-message")}"
	data-label-author="${languageUtil.get(locale, "author", "Author")}"
	data-label-accepted="${languageUtil.get(locale, "accepted")}"
	data-label-answer-selected-by="${languageUtil.get(locale, "answer-selected-by-x", "Answer selected by {0}")}"
	data-label-mark-as-answer="${languageUtil.get(locale, "mark-as-answer")}"
	data-label-reply="${languageUtil.get(locale, "reply")}"
	data-label-comment="${languageUtil.get(locale, "comment")}"
	data-label-edit-reply="${languageUtil.get(locale, "edit-reply")}"
	data-label-delete-reply="${languageUtil.get(locale, "delete-reply")}"
	data-label-upvote="${languageUtil.get(locale, "upvote")}"
	data-label-downvote="${languageUtil.get(locale, "downvote")}"
	data-label-options="${languageUtil.get(locale, "options")}"
	data-label-x-reply="${languageUtil.get(locale, "x-reply")}"
	data-label-x-replies="${languageUtil.get(locale, "x-replies")}">

	<!-- Author info (above the post body) -->
	<div class="forums-message-detail__author-info" id="forumsDetailAuthorInfo" style="display:none;">
		<span class="sticker sticker-circle sticker-lg sticker-outline-0" id="forumsDetailOPAvatar"></span>
		<div>
			<span class="d-block text-dark font-weight-bold" id="forumsDetailOPAuthor"></span>
			<span class="d-block text-secondary small" id="forumsDetailOPDate"></span>
		</div>
	</div>

	<!-- Original Post -->
	<div class="forums-message-detail__op" id="forumsDetailOP" style="display:none;">
		<div class="forums-message-detail__post-body" id="forumsDetailOPBody"></div>
		<div class="forums-message-detail__tags-bar">
			<div class="forums-message-detail__tags" id="forumsDetailOPTags" style="display:none;"></div>
			<div class="forums-vote" id="forumsDetailOPVote"></div>
		</div>
		<div class="forums-message-detail__post-actions" id="forumsDetailOPActions">
			<button class="btn btn-primary" id="forumsDetailReplyBtn" style="display:none;" aria-label="${languageUtil.get(locale, "comment")}">${languageUtil.get(locale, "comment")}</button>
		</div>
	</div>

	<!-- Accepted Solution Section -->
	<div class="forums-message-detail__solution-section" id="forumsDetailSolutionSection" style="display:none;">
		<div id="forumsDetailSolutionCards"></div>
	</div>

	<!-- Replies Section -->
	<div class="forums-message-detail__replies-section" id="forumsDetailRepliesSection" style="display:none;">
		<h2 class="forums-message-detail__section-header text-dark">
			<svg class="lexicon-icon lexicon-icon-message" role="presentation" width="18" height="18">
				<use href="${themeDisplay.getPathThemeImages()}/clay/icons.svg#message"></use>
			</svg>
			<span id="forumsDetailReplyCount"></span>
		</h2>
		<div id="forumsDetailReplyCards"></div>
	</div>
</div>
