assemble:
    - from: site-initializer
      into: site-initializer

forums-site-initializer:
    description: Forums — Home, message detail, admin, and moderation pages backed by custom Liferay Objects.
    name: Forums
    oAuthApplicationHeadlessServer: forums-site-initializer-oauth-application-headless-server
    siteExternalReferenceCode: L_FORUMS
    siteName: Forums
    type: siteInitializer

forums-site-initializer-oauth-application-headless-server:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Forums Site Initializer OAuth Application Headless Server
    scopes:
        - Liferay.Headless.Site.everything
    type: oAuthApplicationHeadlessServer
