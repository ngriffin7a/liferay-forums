<div class="forums-thread-list" id="forumsThreadList"
	data-label-all-threads="${languageUtil.get(locale, "all-discussions")}"
	data-label-category="${languageUtil.get(locale, "category")}"
	data-label-no-threads="${languageUtil.get(locale, "no-threads-found")}"
	data-label-untitled-thread="${languageUtil.get(locale, "untitled-thread")}"
	data-label-unknown="${languageUtil.get(locale, "unknown")}"
	data-label-solved="${languageUtil.get(locale, "solved")}"
	data-label-delete="${languageUtil.get(locale, "delete")}"
	data-label-unable-to-load="${languageUtil.get(locale, "unable-to-load-threads")}"
	data-label-delete-topic="${languageUtil.get(locale, "delete-topic")}"
	data-label-confirm-delete-topic="${languageUtil.get(locale, "confirm-delete-topic")}"
	data-label-cancel="${languageUtil.get(locale, "cancel")}"
	data-label-just-now="${languageUtil.get(locale, "just-now")}"
	data-label-x-minutes-ago="${languageUtil.get(locale, "x-minutes-ago")}"
	data-label-x-hours-ago="${languageUtil.get(locale, "x-hours-ago")}"
	data-label-x-days-ago="${languageUtil.get(locale, "x-days-ago")}"
	data-label-x-reply="${languageUtil.get(locale, "x-reply-singular")}"
	data-label-x-replies="${languageUtil.get(locale, "x-replies-plural")}"
	data-label-flagged="${languageUtil.get(locale, "flagged")}"
	data-label-views="${languageUtil.get(locale, "views")}"
	data-label-all-categories="${languageUtil.get(locale, "all-categories")}"
	data-label-showing="${languageUtil.get(locale, "showing-x-of-x-items")}">
	<div class="container">

		<!-- Breadcrumb -->
		<nav aria-label="breadcrumb" class="forums-thread-list__breadcrumb">
			<ol class="breadcrumb" id="forumsThreadListBreadcrumb">
				<li class="breadcrumb-item"><a href="?">${languageUtil.get(locale, "forums")}</a></li>
				<li class="breadcrumb-item active" aria-current="page" id="forumsThreadListCategoryName">${languageUtil.get(locale, "all-discussions")}</li>
			</ol>
		</nav>

		<!-- Header row: Category name + search + CTA -->
		<div class="forums-thread-list__header">
			<h2 class="forums-thread-list__heading" id="forumsThreadListHeading">${languageUtil.get(locale, "all-discussions")}</h2>
			<div class="forums-thread-list__actions">
				<select class="custom-select forums-thread-list__category-filter" id="forumsThreadListCategoryFilter" aria-label="${languageUtil.get(locale, "filter-by-category")}">
					<option value="">${languageUtil.get(locale, "all-categories")}</option>
				</select>
				<div class="forums-thread-list__search input-group" id="forumsThreadListSearch">
					<input type="text" class="form-control" id="forumsThreadListSearchInput" placeholder="${languageUtil.get(locale, "search-threads")}" aria-label="${languageUtil.get(locale, "search-threads")}">
					<div class="input-group-append">
						<button class="btn btn-outline-secondary" type="button" id="forumsThreadListSearchBtn" aria-label="${languageUtil.get(locale, "search-threads")}">
							<svg class="lexicon-icon lexicon-icon-search" role="presentation" width="16" height="16">
								<use href="${themeDisplay.getPathThemeImages()}/clay/icons.svg#search"></use>
							</svg>
						</button>
					</div>
				</div>
				<button type="button" class="btn forums-thread-list__cta" id="forumsThreadListAskBtn" data-forums-compose style="display: none;">${languageUtil.get(locale, "new-forum-thread")}</button>
			</div>
		</div>

		<!-- Tab filters -->
		<ul class="nav forums-thread-list__tabs" id="forumsThreadListTabs" role="tablist">
			<li class="nav-item" role="presentation">
				<a class="nav-link active" href="#" data-sort="dateCreated:desc" role="tab" id="forumsTabRecent" aria-selected="true">${languageUtil.get(locale, "recent")}</a>
			</li>
			<li class="nav-item" role="presentation">
				<a class="nav-link" href="#" data-sort="lastPostDate:desc" role="tab" id="forumsTabRecentActivity" aria-selected="false">${languageUtil.get(locale, "recent-activity")}</a>
			</li>
		</ul>

		<!-- Showing x-y of total -->
		<div id="forumsThreadListShowing" class="forums-thread-list__showing" style="display:none;"></div>

		<!-- Thread cards -->
		<div id="forumsThreadListCards">
			<div class="text-center py-5" id="forumsThreadListLoading">
				<div class="spinner-border text-primary" role="status">
					<span class="sr-only">${languageUtil.get(locale, "loading")}</span>
				</div>
			</div>
		</div>

		<!-- Pagination -->
		<nav aria-label="${languageUtil.get(locale, "thread-pagination")}" id="forumsThreadListPagination" class="forums-thread-list__pagination" style="display:none;">
			<ul class="pagination justify-content-center" id="forumsThreadListPaginationUl">
			</ul>
		</nav>

	</div>
</div>
